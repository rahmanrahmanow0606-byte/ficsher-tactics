name: Build Ficsher Tactics APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'main.py'
      - 'buildozer.spec'
      - '.github/workflows/android.yml'
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Build Stockfish ARM64
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          git clone --depth 1 --branch sf_19 https://github.com/official-stockfish/Stockfish.git /tmp/Stockfish
          make -C /tmp/Stockfish/src net
          make -C /tmp/Stockfish/src -j2 build ARCH=armv8 COMP=ndk
          mkdir -p libs/arm64-v8a
          cp /tmp/Stockfish/src/stockfish libs/arm64-v8a/libstockfish.so
          chmod 755 libs/arm64-v8a/libstockfish.so
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'Cython==0.29.37' buildozer
      - name: Build debug APK
        run: buildozer android debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ficsher-Tactics-Android-APK
          path: bin/*.apk
          if-no-files-found: error
